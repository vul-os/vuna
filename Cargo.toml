# Vuna — a decentralized crawl → extract → index/graph engine on the KOTVA substrate.
# One engine, pluggable extractors: web-RAG and retail-radar are the first two verticals.
# The node is a Rust binary; the desktop app (app/src-tauri) wraps it so every user runs a node.
#
# The workspace compiles offline: vuna-core has minimal deps (serde/thiserror) and defines the
# FROZEN CONTRACT (types + traits). Heavy deps (tantivy, libp2p, reqwest, embedding runtimes)
# live only in the crate that needs them, added by that crate's owner.
[workspace]
resolver = "2"
members = [
    "crates/vuna-core",     # FROZEN contract: types + traits. Everything depends on this.
    "crates/vuna-frontier", # distributed URL lists (subscribe, dedup, DHT assignment)
    "crates/vuna-crawl",    # polite fetch layer (reqwest + optional headless), robots
    "crates/vuna-extract",  # pluggable extractors: web (chunks+embeddings+links), retail (JSON-LD)
    "crates/vuna-index",    # tantivy keyword + per-space vector (HNSW) + link/knowledge graph
    "crates/vuna-query",    # SEARCH-profile query fan-out/merge + Min-PPR ranking
    "crates/vuna-node",     # the daemon: roles, wiring, the kotva-core binding
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vul-os/vuna"

[workspace.dependencies]
vuna-core = { path = "crates/vuna-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# kotva-core is pinned by TAG, never HEAD (the isango lesson). vuna-node wires it behind the
# vuna-core Kotva seam traits so the rest of the workspace stays substrate-agnostic and offline.
# kotva-core = { git = "https://github.com/vul-os/kotva", tag = "core-v0.2.0" }
