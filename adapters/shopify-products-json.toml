# Vuna retail adapter — Shopify storefront product JSON.
#
# Every Shopify storefront serves a machine-readable JSON twin of each product page at the same
# path, no auth, no separate API key: https://{store}/products/{handle}.js
# This is the highest-signal, lowest-cost retail source Vuna has — it's a JSON endpoint that
# already exists for every Shopify merchant, so there is no HTML-scraping heuristic involved
# (method = "json_endpoint", not "html").
#
# See ../README.md for the manifest format this file is written against.

[adapter]
name           = "shopify-products-json"
version        = 1
extractor_kind = "retail"
method         = "json_endpoint"

[match]
url_pattern  = "https://{store}/products/{handle}.js"
content_type = "application/json"

[fetch]
endpoint    = "https://{store}/products/{handle}.js"
http_method = "GET"
format      = "json"
# Public storefront data — no auth header, no rate-limit exemption. Crawl politely (vuna-crawl's
# per-host rate limiter applies here exactly like any other host).

[iterate]
# One RetailObservation per variant — a single Shopify product page can list many SKUs (size,
# color, etc.), each with its own price and availability.
path = "variants[]"

[fields]
store               = "url:{store}"
sku                 = "json:$.sku"
# Shopify lets merchants leave `sku` blank. When it's empty, fall back to a synthetic id built
# from the numeric variant id, which Shopify always populates.
sku_fallback        = "json:$.id"
availability        = "json:$.available"
quantity            = "json:$.inventory_quantity"
price_minor         = "json:$.price"
price_representation = "minor_int"
# Not in this payload at all — see [notes].currency. `const:none` leaves RetailObservation.currency
# as None; a placeholder string would look like a currency code to every consumer downstream.
currency            = "const:none"

[availability_map]
# `available` is already a JSON boolean, not a string vocabulary — this is a direct bool->enum
# mapping, included for completeness/consistency with the other adapters' [availability_map].
"true"  = "in_stock"
"false" = "out_of_stock"

[notes]
inventory_quantity = """
Many Shopify merchants disable exact inventory counts in the public payload (competitive-intel /
privacy setting on the merchant's side) — when disabled, `inventory_quantity` is simply absent
from the response. RetailObservation.quantity is Option<u64>, so this resolves to None, which is
the honest outcome: the network should report "don't know the count," never fabricate one from
`available` alone.
"""

currency = """
NOT present anywhere in this endpoint's response — currency is a store-level setting (found in the
storefront's /meta.json or theme locale, not per-product). `const:none` above is a real gap, not a
design choice: observations from this adapter carry a price with no currency attached. A working
deployment needs either (a) a per-store currency override supplied at subscription time, alongside
the store's entry in the URL list, or (b) a one-time secondary fetch resolved and cached per
store. The manifest format expresses neither yet — see adapters/README.md, "What this does not
(yet) handle." Note the price still converts correctly regardless (minor_int needs no currency
exponent); it is the label on the number that is missing.
"""

sku_fallback = """
The interpreter tries `sku` first and falls back to `id` (the numeric variant id, which Shopify
always populates) when `sku` is absent or an empty string. Note the consequence: if a merchant
later fills in a real SKU, that variant's observations change join key and look like a brand-new
SKU with no history. A synthetic-but-stable key (`shopify:{store}:{id}`) would avoid that, but the
expression language has no template form — `const:` is a fixed value and `json:` is a bare path —
so it cannot be written today. Recorded here rather than half-implemented in the interpreter.
"""
